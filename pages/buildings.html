<!doctype html>
<html lang="bg"><head><meta charset="UTF-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Сгради — PropertyHub</title></head><body><a class="skip-link btn btn-primary" href="#main">Към съдържанието</a><header id="navigation"></header><main id="main" class="container"><p class="eyebrow">Регистър</p><h1>Сгради и обекти</h1><p class="lead">Самостоятелни обекти в разрешения управленски обхват.</p><div id="message" role="status" aria-live="polite" hidden></div><p id="registry-status">Зареждане на достъпа…</p><a href="/pages/account.html">Към акаунта</a>
<section id="registry" class="mt-4" hidden><label for="scope" class="form-label">Управленски обхват</label><select id="scope" class="form-select mb-4"></select><div class="card"><div class="card-body p-4"><h2 class="h4">Записани обекти</h2><ul id="units" class="list-group list-group-flush"></ul></div></div><section id="unit-create" class="card mt-4" hidden><div class="card-body p-4"><h2 class="h4">Добави обект</h2><p>Неизвестната площ остава празна. Лица, собственост и финансова готовност се въвеждат в следващия пакет.</p><form id="create-unit" class="row g-3"><div class="col-sm-6"><label for="number" class="form-label">Номер / обозначение</label><input id="number" name="number" class="form-control" required maxlength="40"></div><div class="col-sm-6"><label for="type" class="form-label">Тип</label><select id="type" name="type" class="form-select"><option value="apartment">Апартамент</option><option value="shop">Магазин</option><option value="office">Офис</option><option value="garage">Гараж</option><option value="other">Друг</option></select></div><div class="col-sm-6"><label for="floor" class="form-label">Етаж (по желание)</label><input id="floor" name="floor" class="form-control" maxlength="40"></div><div class="col-sm-6"><label for="area" class="form-label">Площ, m² (по желание)</label><input id="area" name="area" type="number" min="0.0001" step="0.0001" max="99999999.9999" class="form-control"></div><div class="col-12"><button class="btn btn-success">Запиши обекта</button></div></form></div></section></section></main><script type="module" src="/src/pages/buildings.js"></script></body></html>
