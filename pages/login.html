<!doctype html>
<html lang="bg"><head><meta charset="UTF-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Вход — PropertyHub</title></head>
<body><a class="skip-link btn btn-primary" href="#main">Към съдържанието</a><header id="navigation"></header><main id="main" class="container"><h1>Вход</h1><p class="lead">Влез с потвърдения си акаунт.</p><div id="message" role="status" aria-live="polite" hidden></div>
<section class="card"><div class="card-body p-4"><form id="login"><label for="login-email" class="form-label">Имейл</label><input id="login-email" name="email" type="email" class="form-control mb-3" autocomplete="username" required maxlength="254"><label for="login-password" class="form-label">Парола</label><input id="login-password" name="password" type="password" class="form-control mb-3" autocomplete="current-password" required maxlength="256"><button class="btn btn-success">Влез</button> <a href="/pages/register.html" class="btn btn-outline-secondary">Регистрация</a></form></div></section>
<details class="mt-4" id="password-reset"><summary>Забравена парола</summary><p class="mt-3">Поискай защитена връзка и я отвори в същия браузър. Тя не променя назначенията или правата ти.</p><form id="password-reset-request"><label for="reset-email" class="form-label">Имейл</label><input id="reset-email" name="email" type="email" class="form-control mb-3" autocomplete="email" required maxlength="254"><button class="btn btn-outline-secondary">Поискай възстановяване</button></form></details>
<details class="mt-4"><summary>Ново писмо за потвърждение</summary><form id="resend" class="mt-3"><label for="resend-email" class="form-label">Имейл</label><input id="resend-email" name="email" type="email" class="form-control mb-3" autocomplete="email" required maxlength="254"><button class="btn btn-outline-secondary">Изпрати отново</button></form></details>
</main><script type="module" src="/src/pages/auth-entry.js"></script></body></html>
