<!doctype html>
<html lang="bg"><head><meta charset="UTF-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Регистрация — PropertyHub</title></head>
<body><a class="skip-link btn btn-primary" href="#main">Към съдържанието</a><header id="navigation"></header><main id="main" class="container"><h1>Регистрация</h1><p class="lead">Един акаунт с отделни проверени назначения.</p><div id="message" role="status" aria-live="polite" hidden></div><section class="card"><div class="card-body p-4"><p>Потвърди имейла си в същия браузър, след което изчакай проверено назначение. Регистрацията не предоставя административни права.</p>
<form id="register"><label for="register-name" class="form-label">Име за представяне</label><input id="register-name" name="name" class="form-control mb-3" autocomplete="nickname" required maxlength="100"><label for="register-email" class="form-label">Имейл</label><input id="register-email" name="email" type="email" class="form-control mb-3" autocomplete="email" required maxlength="254"><label for="register-password" class="form-label">Парола (поне 8 знака и една цифра (0–9))</label><input id="register-password" name="password" type="password" class="form-control mb-3" autocomplete="new-password" required minlength="8" maxlength="256" pattern=".*[0-9].*"><label for="register-confirm" class="form-label">Повтори паролата</label><input id="register-confirm" name="password-confirm" type="password" class="form-control mb-3" autocomplete="new-password" required minlength="8" maxlength="256" pattern=".*[0-9].*"><button class="btn btn-success">Създай акаунт</button> <a href="/pages/login.html" class="btn btn-outline-secondary">Към входа</a></form>
</div></section></main><script type="module" src="/src/pages/auth-entry.js"></script></body></html>
