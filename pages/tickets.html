<!doctype html>
<html lang="bg"><head><meta charset="UTF-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Сигнали — PropertyHub</title></head>
<body><a class="skip-link btn btn-primary" href="#main">Към съдържанието</a><header id="navigation"></header>
<main id="main" class="container"><p class="eyebrow">Поддръжка</p><h1>Сигнали</h1><p class="lead">Собствени сигнали и разрешена работа по обхват.</p>
<div id="message" role="status" aria-live="polite" hidden></div><p id="ticket-access">Зареждане…</p>
<section id="ticket-create" class="card mb-4" hidden><div class="card-body p-4"><h2 class="h4">Подай сигнал</h2><p>Само към текущ разрешен собствен имот. Прикачване на файл предстои.</p>
<form id="new-ticket"><label class="form-label" for="ticket-unit">Имот и обхват</label><select id="ticket-unit" name="unit" class="form-select mb-3" required></select>
<label class="form-label" for="ticket-title">Заглавие</label><input id="ticket-title" name="title" class="form-control mb-3" maxlength="160" required>
<label class="form-label" for="ticket-description">Описание</label><textarea id="ticket-description" name="description" class="form-control mb-3" rows="4" maxlength="4000" required></textarea>
<button class="btn btn-success">Подай сигнал</button></form></div></section>
<button id="refresh-tickets" class="btn btn-outline-secondary mb-3" type="button" hidden>Обнови сигналите</button><section aria-label="Разрешени сигнали" id="ticket-list"></section>
</main><script type="module" src="/src/pages/tickets.js"></script></body></html>
